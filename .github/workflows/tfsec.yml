name: tfsec

# Blocking Terraform static analysis. Runs on every PR into main, fails on any
# finding at HIGH or above, and uploads the reports as evidence.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a new tfsec release can never silently change the verdict.
  TFSEC_VERSION: "1.28.14"
  TFSEC_SHA256: "329ae7f67f2f1813ebe08de498719ea7003c75d3ca24bb0b038369062508008e"
  # tfsec scans a directory, parsing every *.tf in it as one module. week-4 holds
  # exactly one: secure_s3.tf. The vulnerable reference is insecure_s3.tf.example,
  # which is skipped because it does not end in .tf.
  SCAN_PATH: "week-4"
  MIN_SEVERITY: "HIGH"

jobs:
  tfsec:
    name: tfsec (HIGH+, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tfsec ${{ env.TFSEC_VERSION }}
        run: |
          set -euo pipefail
          tarball="tfsec_${TFSEC_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "$tarball" \
            "https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}/${tarball}"
          echo "${TFSEC_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" tfsec
          sudo install -m 0755 tfsec /usr/local/bin/tfsec

      - name: Run tfsec
        id: tfsec
        run: |
          # Actions runs steps with `bash -e`; turn that off so a tfsec finding
          # does not abort the step before the evidence is uploaded. The build
          # is failed deliberately in the last step instead.
          set +e
          mkdir -p evidence
          tfsec "$SCAN_PATH" \
            --minimum-severity "$MIN_SEVERITY" \
            --format text,json,sarif \
            --out evidence/tfsec \
            --no-color
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90

      - name: Fail on findings
        env:
          CODE: ${{ steps.tfsec.outputs.exit_code }}
        run: |
          # Fail closed: an unset code means the scan itself did not complete.
          if [ "${CODE:-1}" -ne 0 ]; then
            echo "::error::tfsec found findings at ${MIN_SEVERITY}+ in ${SCAN_PATH}. See the tfsec-evidence artifact."
            exit 1
          fi
          echo "No findings at ${MIN_SEVERITY}+."
